server:
  port: 28180
  mode: debug # debug | release
  # 跨域来源白名单：默认为空 = 同源模式（不下发任何 CORS 头；前后端同源托管、本地 vite 代理均无需配置）。
  # 需要跨域访问 API 时配置来源列表，如 ["https://admin.example.com"]；显式配置 ["*"] 恢复通配（不允许凭证）。
  # 环境变量 APP_SERVER_CORSORIGINS（逗号分隔）可覆盖
  corsOrigins: []

db:
  driver: mysql # mysql | postgres | sqlite
  autoMigrate: true # 启动时自动建表 + 种子数据
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    password: "123456"
    dbname: smilex_admin_service # 独立库！与 embodied-platform 共用 MySQL 实例但必须分库，否则同名表（tenants/roles/app_users 等）被两边 autoMigrate 合并、数据互见
    charset: utf8mb4
    maxOpenConns: 20
    maxIdleConns: 10
  postgres:
    host: 127.0.0.1
    port: 5432
    user: postgres
    password: "123456"
    dbname: smilex_admin_service # 同 mysql：与平台分库，防同名表互见
    sslmode: disable
    maxOpenConns: 20
    maxIdleConns: 10
  sqlite:
    path: ./data/smilex.db

jwt:
  # 签名密钥：仓库不再保存任何可用密钥。本地开发留空即可启动（debug 模式仅告警）；
  # 生产/部署必须注入强随机值：APP_JWT_SECRET（openssl rand -base64 32），release 模式下空/过短将拒绝启动。
  # 更换后所有已签发 token 失效需重新登录；agent 供应商密钥如未单独配置 cryptoKey 也需重新保存一次
  secret: ""
  issuer: smilex-admin
  expireHours: 2 # access token 有效期
  refreshHours: 168 # refresh token 有效期，同时为会话生命周期（TTL 到期即下线）

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

auth:
  captchaEnabled: false # 登录验证码开关；本地调试暂时关闭，生产必须改回 true

cache:
  l2Enabled: true # 二级缓存（Redis）开关；false 时 RBAC 等读缓存仅用进程内一级缓存（多实例间不共享）

# embodied-platform 平台接入（唯一身份源 + 设备/型号/租户同步 + 文件存储）
# 部署前置（对照平台 docs/dev/integration-guide.md §11）：
#   1. 平台侧创建商户（appKey/appSecret）并配置 scopes：
#      设备域 device:*、遥测 telemetry:read、data-event:read
#      租户域 tenant:*（商户自管租户，同步创建即自动入商户租户集）
#      型号域 model:*、物模型 thing-model:read（型号管理 + 选择器）
#   2. 平台 CORS 白名单（cors.allowedOrigins）登记本系统前端 Origin（登录直调平台）
#   3. NTP 校时（HMAC 时间戳偏差 ≤ 300s）
#   4. （可选）storage 段：storage-gateway API Key（文件存储）；不配置时降级本地磁盘
#   注：用户（成员）管理走开放面 user:*（列表=本商户绑定成员，新增=即建即绑，删除=解绑），
#   管理面服务账号通道已于 2026-09-17 移除，无需配置 platform.admin
platform:
  baseUrl: http://localhost:27080 # 平台主服务（/api/v1 与 /open-api/v1 同源）
  appKey: "mk_0e94e71768252d89" # 商户 AppKey（平台商户管理创建）
  appSecret: "51e2f6710de945c50fd3d0f92731ef746d00d5080a5c4c0b9349e0d5a7eea48c" # 商户 AppSecret 明文（仅创建时返回一次，妥善保管）
  storage: # storage-gateway 直连（文件存储后端）
    baseUrl: http://localhost:27091
    apiKeyId: ""
    apiSecret: ""
    bucket: default
  timeoutSeconds: 15 # 平台无本地引导账号（准入唯一来源=平台商户成员绑定/商户管理员标记）

agent: # 智能体模块（LLM 配置底座）
  # 供应商 API Key 的 AES 加密密钥（任意长度，内部派生 AES-256）；留空则从 jwt.secret 派生，
  # 注意：更换 jwt.secret 后已存密钥不可解密，需到「模型供应商」重新保存一次密钥
  cryptoKey: ""
  usageRetentionDays: 90 # 用量计量流水保留天数，超期每日自动清理；0 永久保留

log:
  retentionDays: 90 # 登录/操作日志保留天数，超期每日自动清理；0 表示永久保留
  # 应用运行日志：按日期滚动落盘（dir/filename-2006-01-02.log）
  dir: ./logs # 日志文件目录；置空则只输出控制台
  filename: app # 文件名前缀
  level: "" # 最低级别 debug|info|warn|error；空则 debug 模式=debug，release 模式=info
  maxAgeDays: 30 # 日志文件保留天数，超期自动清理；0 永久保留
  console: false # 是否同时输出到控制台（debug 模式无论此项都会输出控制台）

export:
  maxSizeMB: 50 # 单个导出文件大小上限（MB），超出截断并在记录上标记 truncated
  maxRows: 100000 # 单个导出文件最大数据行数，超出截断
  retentionDays: 7 # 导出记录与产物文件保留天数，超期每日自动清理；0 表示永久保留
  queueSize: 64 # 导出任务队列容量，满则新任务返回 429
  # 导出字段脱敏：导出列 key -> 脱敏规则；可用规则 phone / email / idcard / bankcard / name / ip / none
  # 未配置的列按原值导出；规则 none 表示显式不脱敏
  mask:
    phone: phone
    email: email

storage:
  # 存储后端：platform（embodied-platform storage-gateway，配置 platform.storage 后自动启用）
  # 或 local（降级/历史存量读取）。driver 留空时自动选择：平台存储已配置 → platform，否则 local。
  driver: ""
  maxSizeMB: 20 # 单文件上传大小上限
  signExpireMinutes: 15 # 预签名下载 URL 有效期（分钟）
  denyExts: [] # 禁止上传的扩展名（如 ["exe","sh"]），空则用内置黑名单
  local:
    dir: ./data/uploads # 本地存储根目录（平台存储未配置时的降级写入后端；历史存量文件读取）
