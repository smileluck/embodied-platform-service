# CI：后端（vet + test + build）与前端（类型检查 + 构建）双流水线
# 后端测试使用内存 sqlite 与 miniredis，无外部服务依赖
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 注意：go.mod 中平台 SDK 的本地 replace（../embodied-platform/sdk）需在 CI 环境移除，
# 改走 GOPRIVATE 拉取后方可构建（见 README「平台 SDK 依赖」）。
jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build # npm run build 内含 vue-tsc 类型检查
        run: npm run build
